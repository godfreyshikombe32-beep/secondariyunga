<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Results - Iyunga Portal</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head>
<body><div class="content"><div class="page-title"><div><h1><i class="fa-solid fa-file-lines"></i> Results</h1><p>Review recent examination performance.</p></div><div class="form-actions"><a href="dashboard.html" class="secondary-btn"><i class="fa-solid fa-arrow-left"></i> Dashboard</a><a href="results.html?view=add" class="primary-btn" style="text-decoration:none;"><i class="fa-solid fa-plus"></i> Add Results</a></div></div><div class="dashboard-card"><table><thead><tr><th>Examination</th><th>Class</th><th>Average</th><th>Status</th></tr></thead><tbody id="resultTableBody"><tr><td>Midterm Examination</td><td>Form I</td><td>68%</td><td><span class="status active-status">Published</span></td></tr><tr><td>Midterm Examination</td><td>Form IV</td><td>72%</td><td><span class="status active-status">Published</span></td></tr></tbody></table></div><div class="dashboard-card student-form-card" id="resultFormPanel" hidden><form onsubmit="saveResult(event)"><div class="form-grid"><div class="input-group"><label for="examName">Examination Name</label><input id="examName" type="text" required></div><div class="input-group"><label for="resultClass">Class</label><select id="resultClass"><option>Form I</option><option>Form II</option><option>Form III</option><option>Form IV</option><option>Form V</option><option>Form VI</option></select></div><div class="input-group"><label for="resultSubject">Subject</label><select id="resultSubject"><option>Mathematics</option><option>English</option><option>Physics</option><option>Chemistry</option><option>Biology</option></select></div><div class="input-group"><label for="resultAverage">Class Average (%)</label><input id="resultAverage" type="number" min="0" max="100" required></div><div class="input-group"><label for="resultDate">Examination Date</label><input id="resultDate" type="date" required></div><div class="input-group"><label for="resultStatus">Status</label><select id="resultStatus"><option>Published</option><option>Draft</option></select></div></div><div class="form-actions"><a href="results.html" class="secondary-btn">Cancel</a><button class="primary-btn" type="submit">Save Results</button></div></form></div></div><script src="script.js"></script></body></html>
