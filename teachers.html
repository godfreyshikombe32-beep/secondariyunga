<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Teachers - Iyunga Portal</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head>
<body><div class="content"><div class="page-title"><div><h1><i class="fa-solid fa-chalkboard-user"></i> Teachers</h1><p>Manage teaching staff.</p></div><div class="form-actions"><a href="dashboard.html" class="secondary-btn"><i class="fa-solid fa-arrow-left"></i> Dashboard</a><a href="teachers.html?view=add" class="primary-btn" style="text-decoration:none;"><i class="fa-solid fa-plus"></i> Add Teacher</a></div></div><div class="dashboard-card"><table><thead><tr><th>Name</th><th>Subject</th><th>Classes</th><th>Status</th></tr></thead><tbody id="teacherTableBody"><tr><td>Asha Mwakalinga</td><td>Mathematics</td><td>Form I - IV</td><td><span class="status active-status">Active</span></td></tr><tr><td>Peter Joseph</td><td>English</td><td>Form I - VI</td><td><span class="status active-status">Active</span></td></tr></tbody></table></div><div class="dashboard-card student-form-card" id="teacherFormPanel" hidden><form onsubmit="saveTeacher(event)"><div class="form-grid"><div class="input-group"><label for="teacherName">Full Name</label><input id="teacherName" type="text" required></div><div class="input-group"><label for="teacherEmail">Email Address</label><input id="teacherEmail" type="email" required></div><div class="input-group"><label for="teacherPhone">Phone Number</label><input id="teacherPhone" type="tel" required></div><div class="input-group"><label for="teacherSubject">Subject</label><select id="teacherSubject"><option>Mathematics</option><option>English</option><option>Physics</option><option>Chemistry</option><option>Biology</option></select></div><div class="input-group"><label for="teacherClasses">Classes</label><input id="teacherClasses" type="text" required></div><div class="input-group"><label for="teacherRole">Role</label><select id="teacherRole"><option>Subject Teacher</option><option>Class Teacher</option><option>Head of Department</option></select></div></div><div class="form-actions"><a href="teachers.html" class="secondary-btn">Cancel</a><button class="primary-btn" type="submit">Save Teacher</button></div></form></div></div><script src="script.js"></script></body></html>
